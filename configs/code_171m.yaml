# NCM code model - the recipe published with the paper's OpenWebText replication
# (iskhare/ncm-owt-8sq-ctx64-16k): multiscale residual VQ-VAE over 64-token
# windows, levels (1,4,9,16,25,36,49,64) = 204 latent positions, 16384 codes
# per level, then a 16-layer / 1024-wide generator trained on the frozen codec's
# codes. Note: the published replication reports 171M parameters for its
# generator, but it ties the output heads to the codebooks and does not predict
# level 0; this config uses untied trainable heads and predicts level 0 (needed
# for FIM), which brings it to ~336M. Use configs/code_pilot.yaml for a run that
# fits in a day on one consumer GPU.
#
# Usage:
#   python -m forge.cli train-tokenizer --config configs/code_171m.yaml
#   python -m forge.cli train-generator --config configs/code_171m.yaml
#   python -m forge.cli make-fim        --config configs/code_171m.yaml --prefix-len 64 --suffix-len 64

task: code-fim

tokenizer:
  pre_tokenizer:
    name: hf
    tokenizer: hf
    model_id: Qwen/Qwen3-0.6B
    special_tokens:
      eos_token: <|im_end|>
      pad_token: <|endoftext|>
  vqvae:
    n_layers: 6
    embed_dim: 384
    in_vocab_size: 151680
    context_length: 64
    compression_factor: 1
    dropout: 0.1
    pre_quant_groupnorm: 8
    use_qk_norm: true
    pre_quant_dropout: 0.25
    enc_positional: false
    dec_positional: true
    dec_layers: 4
    vqvae_vocab_size:
    - 16384
    - 16384
    - 16384
    - 16384
    - 16384
    - 16384
    - 16384
    - 16384
    checkpoint_path: out/tokenizer/tokenizer.pt
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.99
      epsilon: 1.0e-05
      commitment_cost: 0.25
      learned_l1_sampling: true
      learned_l1_cascade: true
      learned_l1_cascade_base: 4
      learned_l1_cascade_norm: true
      learned_l1_cascade_norm_final: true
      learned_all_sampling: false
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 0
        learnable_ratio: false
      aux:
        fine_drop:
          prob: 0.5
          min_keep: 1
      levels:
        use_manual_levels: true
        manual_levels:
        - 1
        - 4
        - 9
        - 16
        - 25
        - 36
        - 49
        - 64

model:
  n_layer: 16
  n_head: 16
  bias: true
  dropout: 0.1
  n_embd: 1024
  context_length: 192
  prefix_len: 128
  raw_token_prefix: true
  prefix_pad_token_id: 151643
  vocab_size:
  - 16384
  - 16384
  - 16384
  - 16384
  - 16384
  - 16384
  - 16384
  attn_pattern: block_diagonal
  use_positional_encoding: true
  use_level_encoding: true
  use_rope: true
  rope_base: 100000
  use_qk_norm: true
  ctx_encoder:
    enabled: false
    n_layer: 4
    vocab_size: 151680
  use_flex_attention: false
  untied_head_bias: false
  query_level0: false
  predict_level0: true
  tie_heads_to_codebook: false

data:
  corpus: data/code.jsonl
  format: jsonl
  task: fim
  prefix_len: 64
  suffix_len: 64
  target_len: 64
  cond_order: suffix_first
  max_docs: 0

train:
  steps: 100000
  batch_size: 512
  lr: 3.0e-04
  weight_decay: 0.1
  warmup: 1000
  grad_clip: 1.0
  loss_alpha: 0.0
  corruption_rate: 0.1
  num_workers: 4
  log_every: 50
  eval_every: 1000
  save_every: 2000
  tokenizer_out_dir: out/tokenizer
  out_dir: out/generator
  tokenizer_steps: 100000
  tokenizer_batch_size: 2048
