task: smoke
tokenizer:
  pre_tokenizer:
    name: hf
    tokenizer: hf
    model_id: sshleifer/tiny-gpt2
    special_tokens:
      eos_token: <|endoftext|>
      pad_token: <|endoftext|>
  vqvae:
    n_layers: 2
    embed_dim: 64
    in_vocab_size: 50257
    context_length: 16
    compression_factor: 1
    dropout: 0.0
    pre_quant_groupnorm: 4
    use_qk_norm: true
    pre_quant_dropout: 0.0
    enc_positional: false
    dec_positional: true
    dec_layers: 2
    vqvae_vocab_size:
    - 512
    - 512
    - 512
    - 512
    checkpoint_path: out/smoke/tokenizer/tokenizer.pt
    vector_quantizer_config:
      clss: multiscale_residual_vector_quantizer
      decay: 0.99
      epsilon: 1.0e-05
      commitment_cost: 0.25
      learned_l1_sampling: true
      learned_l1_cascade: false
      learned_all_sampling: false
      quant_resi:
        enabled: true
        ratio: 0.5
        share_mode: 0
        learnable_ratio: false
      aux:
        fine_drop:
          prob: 0.5
          min_keep: 1
      levels:
        use_manual_levels: true
        manual_levels:
        - 1
        - 4
        - 8
        - 16
model:
  n_layer: 2
  n_head: 4
  bias: true
  dropout: 0.0
  n_embd: 128
  context_length: 32
  prefix_len: 8
  raw_token_prefix: true
  prefix_pad_token_id: 50256
  vocab_size:
  - 512
  - 512
  - 512
  attn_pattern: block_diagonal
  use_positional_encoding: true
  use_level_encoding: true
  use_rope: true
  rope_base: 10000
  use_qk_norm: true
  ctx_encoder:
    enabled: false
    n_layer: 2
    vocab_size: 50257
  use_flex_attention: false
  untied_head_bias: false
  query_level0: false
  predict_level0: true
  tie_heads_to_codebook: false
data:
  corpus: data/code.jsonl
  format: jsonl
  task: fim
  target_len: 16
  prefix_len: 4
  max_docs: 0
  suffix_len: 4
  cond_order: suffix_first
train:
  steps: 20
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0
  warmup: 2
  grad_clip: 1.0
  loss_alpha: 0.0
  corruption_rate: 0.1
  num_workers: 0
  log_every: 5
  eval_every: 20
  save_every: 20
  tokenizer_out_dir: out/smoke/tokenizer
  out_dir: out/smoke/generator
  tokenizer_steps: 20
  tokenizer_batch_size: 8
