name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU torch and the training-side deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers omegaconf numpy pytest

      - name: Vendor the upstream NCM modules
        run: git clone --depth 1 https://github.com/HazyResearch/ncm.git vendor/ncm

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Byte-compile the scripts (they are not imported by the tests)
        run: python -m compileall -q forge scripts tests
